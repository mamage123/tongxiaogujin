[pytest]
testpaths = tests
addopts = -q

# 这里**故意不写** `--basetemp`，两条原因叠在一起（都实测复现过）：
#
# 1. 指定 basetemp 时 pytest **每次启动**都会对它整棵 `shutil.rmtree`。而宿主
#    （WorkBuddy 的 sitecustomize）装了「安全删除」守卫：单次删除超过 50 个文件
#    就 `SystemExit(1)`。200 条用例留下约两万个文件，于是第二次跑测试必然在
#    setup 阶段报一片 `SAFE_DELETE_BULK_CONFIRM_REQUIRED` ERROR —— 看着像代码坏了，
#    其实一条用例都没跑到。踩过两次，两次都误判。
# 2. 指定 basetemp 时 pytest 会强制 `tmp_path_retention_policy=always`，下面这条
#    逐条清理的设置会被忽略，废弃目录只会越积越多。
#
# 现在的做法：临时根目录由 `tests/conftest.py` 用 `mkdtemp()` 每次新建，
# `retention_policy=none` 让每条用例跑完立刻删掉自己的目录（一次十来文件，守卫不管）。
tmp_path_retention_policy = none
tmp_path_retention_count = 0

filterwarnings =
    ignore::DeprecationWarning
